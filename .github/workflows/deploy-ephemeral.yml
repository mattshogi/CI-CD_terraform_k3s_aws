name: Deploy Ephemeral Environment

# Provision → validate → destroy, with state stored remotely per run so a
# crashed job never orphans untracked resources.
#
# Required repository configuration:
#   Variable TF_STATE_BUCKET  — S3 bucket from scripts/bootstrap_remote_state.sh
#   Variable AWS_ROLE_ARN     — IAM role for GitHub OIDC (preferred), OR
#   Secrets  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY as fallback
#   Variable AWS_REGION       — optional, defaults to us-east-1

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment label
        type: choice
        options: [staging, production]
        default: staging
      instance_type:
        description: EC2 instance type (t3.small+ recommended with monitoring)
        type: string
        default: t3.small
      enable_monitoring:
        description: Install Prometheus + Grafana
        type: boolean
        default: true
      enable_tls:
        description: cert-manager TLS at <ip>.sslip.io (self-signed issuer)
        type: boolean
        default: true
      use_baked_ami:
        description: Use latest Packer-baked k3s-node AMI (run Bake k3s AMI first)
        type: boolean
        default: false
      enable_gitops:
        description: Deploy app via Flux HelmRelease instead of push-time helm install
        type: boolean
        default: false
      ha_mode:
        description: High availability (3 k3s servers / 3 AZs / NLB — ~3× instance cost + NLB; runs a chaos test)
        type: boolean
        default: false
      keep_after_validate:
        description: Keep resources for debugging (destroy manually later; state stays in S3)
        type: boolean
        default: false
      image_ref:
        description: Image override (repository:tag). Empty = image built by CI for this commit
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # GitHub OIDC federation with AWS

concurrency:
  group: deploy-ephemeral-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    name: Provision → Validate → ${{ inputs.keep_after_validate && 'Keep' || 'Destroy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # All workflow inputs reach Terraform through TF_VAR_* environment
    # variables — never shell-interpolated — to rule out script injection.
    env:
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_instance_type: ${{ inputs.instance_type }}
      TF_VAR_enable_monitoring: ${{ inputs.enable_monitoring }}
      TF_VAR_enable_tls: ${{ inputs.enable_tls }}
      TF_VAR_use_baked_ami: ${{ inputs.use_baked_ami }}
      TF_VAR_enable_gitops: ${{ inputs.enable_gitops }}
      TF_VAR_ha_mode: ${{ inputs.ha_mode }}
      TF_VAR_repo_ref: ${{ github.sha }}
      TF_VAR_resource_name_suffix: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Fail fast on missing configuration
        run: |
          missing=0
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET is not set (run scripts/bootstrap_remote_state.sh, then set the variable)"; missing=1
          fi
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ] && [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "::error::Set repository variable AWS_ROLE_ARN (OIDC, preferred) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets"; missing=1
          fi
          exit $missing

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: deploy-ephemeral-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static keys fallback)
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.x
          terraform_wrapper: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: platformctl/go.mod
          cache: true

      - name: Build platformctl (for the deploy summary)
        run: cd platformctl && go build -o "${RUNNER_TEMP}/platformctl" ./cli

      - name: Deploy (provision + capture outputs)
        id: deploy
        # Orchestration lives in scripts/deploy_env.sh so the pipeline and
        # platformctl drive the same commands. admin_cidr and app_image are
        # resolved inside the script; all other TF_VAR_* come from the job env.
        env:
          RUN_ID: ${{ github.run_id }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
          MODE: apply
          IMAGE_REF: ${{ inputs.image_ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy_env.sh
          scripts/deploy_env.sh

      - name: Validate endpoints
        id: validate
        if: steps.deploy.outputs.endpoint_host != ''
        run: |
          chmod +x scripts/validate_endpoints.sh
          scripts/validate_endpoints.sh "${{ steps.deploy.outputs.endpoint_host }}" 45 10

      - name: "Chaos: terminate one node, verify continued service"
        id: chaos
        if: inputs.ha_mode == true && steps.validate.outcome == 'success'
        # Values flow through env (not inline interpolation) per this
        # workflow's injection-safety convention.
        env:
          INSTANCE_IDS_JSON: ${{ steps.deploy.outputs.instance_ids }}
          ENDPOINT_HOST: ${{ steps.deploy.outputs.endpoint_host }}
        run: |
          set -euo pipefail
          # Terminate the LAST server (node 0 runs the deployment tooling, so we
          # spare it) and prove the NLB keeps serving through the remaining quorum.
          victim=$(printf '%s' "$INSTANCE_IDS_JSON" | jq -r '.[-1]')
          if [ -z "$victim" ] || [ "$victim" = "null" ]; then
            echo "::error::Could not resolve an instance id to terminate from server_instance_ids"
            exit 1
          fi
          echo "[CHAOS] Terminating $victim and re-validating https://${ENDPOINT_HOST}/"
          aws ec2 terminate-instances --instance-ids "$victim" >/dev/null
          # Give the NLB time to fail the target's health check and drain it.
          sleep 90
          chmod +x scripts/validate_endpoints.sh
          # Reduced retries: service should already be up on the survivors.
          scripts/validate_endpoints.sh "$ENDPOINT_HOST" 12 10

      - name: SSM diagnostics (on validation failure)
        if: failure() && steps.deploy.outputs.instance_id != ''
        run: |
          iid="${{ steps.deploy.outputs.instance_id }}"
          cid=$(aws ssm send-command --instance-ids "$iid" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["k3s kubectl get nodes -o wide || true","k3s kubectl get pods -A -o wide | head -n 40 || true","k3s kubectl get svc,ingress -A || true","tail -n 150 /var/log/cloud-init-output.log || true"]' \
            --query 'Command.CommandId' --output text) || exit 0
          sleep 10
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$iid" \
            --query 'StandardOutputContent' --output text > ssm-diagnostics.txt || true
          echo "SSM diagnostics captured ($(wc -c < ssm-diagnostics.txt) bytes)"

      - name: Deploy summary (platformctl; AI-polished when enabled)
        if: steps.deploy.outputs.endpoint_host != ''
        continue-on-error: true
        env:
          PLATFORMCTL_AI: ${{ vars.PLATFORMCTL_AI || 'none' }}
          PLATFORMCTL_AI_API_KEY: ${{ secrets.PLATFORMCTL_AI_API_KEY }}
          RUN_ID: ${{ github.run_id }}
          IMAGE: ${{ steps.deploy.outputs.app_image }}
          ENDPOINT: ${{ steps.deploy.outputs.endpoint_host }}
          HA: ${{ inputs.ha_mode }}
          ITYPE: ${{ inputs.instance_type }}
          REACHABLE: ${{ steps.validate.outcome == 'success' }}
        run: |
          set -euo pipefail
          topo=single; [ "$HA" = "true" ] && topo=ha
          cents=$("${RUNNER_TEMP}/platformctl" cost "$ITYPE" "$topo" 20 | jq -r '.total_cents')
          printf '{"run_id":"%s","image":"%s","endpoint":"%s","reachable":%s,"ha_mode":%s,"cost_cents":%s}\n' \
            "$RUN_ID" "$IMAGE" "$ENDPOINT" "$REACHABLE" "$HA" "$cents" > facts.json
          {
            echo "## Deploy summary (provider: ${PLATFORMCTL_AI})"
            echo
            "${RUNNER_TEMP}/platformctl" summarize-deploy facts.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Ephemeral deploy — ${{ inputs.environment }}"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${{ steps.deploy.outputs.app_image }}\` |"
            echo "| Server IP | \`${{ steps.deploy.outputs.server_ip || 'n/a' }}\` |"
            echo "| Endpoint host | \`${{ steps.deploy.outputs.endpoint_host || 'n/a' }}\` |"
            echo "| HA mode | ${{ inputs.ha_mode }} |"
            echo "| Instance | \`${{ steps.deploy.outputs.instance_id || 'n/a' }}\` |"
            echo "| State key | \`ephemeral/${{ github.run_id }}.tfstate\` |"
            echo "| Apply | ${{ steps.deploy.outcome }} |"
            echo "| Validation | ${{ steps.validate.outcome }} |"
            echo "| Chaos test | ${{ steps.chaos.outcome }} |"
            echo "| Destroyed | ${{ !inputs.keep_after_validate }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-ephemeral-${{ github.run_id }}
          path: |
            terraform-apply.log
            ssm-diagnostics.txt
          if-no-files-found: ignore

      - name: Terraform destroy
        # Runs even when apply/validation failed: the per-run remote state key
        # means partial creations are tracked and torn down. Same script the
        # agent layer calls, so teardown is one code path.
        if: always() && steps.deploy.outcome != 'skipped' && !inputs.keep_after_validate
        env:
          RUN_ID: ${{ github.run_id }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          chmod +x scripts/destroy_env.sh
          scripts/destroy_env.sh
